<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鳩の声（録音用）</title>
<style>
  :root { --bg: #e9edf1; --fg: #14181c; --accent: #2f5d50; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #14181c; --fg: #e9edf1; --card: #1f2a24; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
  h1 { font-size: 1.4rem; color: var(--accent); margin: 8px 0 0; }
  p { margin: 0; line-height: 1.6; }
  .card { background: var(--card); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; }
  .card b { color: var(--accent); }
  button { font: inherit; font-size: 1.1rem; padding: 10px 16px; border-radius: 10px; border: 2px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; justify-self: start; }
  textarea { font: inherit; font-size: 1.1rem; width: 100%; box-sizing: border-box; min-height: 4em; padding: 8px; border-radius: 8px; }
  .hint { opacity: .75; font-size: .95rem; }
</style>
</head>
<body>
<main>
  <h1>鳩の声（デモ動画の録音用）</h1>
  <p class="hint">アプリの読み上げと同じ声（この端末の日本語の声・少し高く・少しゆっくり）で読みます。アプリ本体とは別のページで、データには触りません。録るときは、この端末の画面録画（端末の音も録る設定）を始めてから押してください。</p>
  <div id="lines"></div>
  <section class="card">
    <b>自由に読む</b>
    <textarea id="free">くるっくー。はとやまです。</textarea>
    <button type="button" id="free-btn">読む</button>
  </section>
  <p class="hint" id="voice"></p>
</main>
<script>
  // 鳩のセリフ（台本 v0.3）
  const LINES = [
    ["鳩A", "0:10 いつもの朝", "いまは、日付も天気も予定も、ここに出しておきます。何度でも、今日を確かめられます。"],
    ["鳩B", "0:35 家族からの知らせ", "音で知らせたら、あとは静かに置いておきます。忘れても、もう一度見れば大丈夫。"],
    ["鳩C", "1:50 日々を振り返る", "忘れても、日々は残ります。"],
    ["鳩D", "2:45 オチ", "……くるっくー。"],
  ];
  let jaVoice = null;
  function pickVoice() {
    const ja = speechSynthesis.getVoices().filter((v) => /^ja/i.test(v.lang));
    jaVoice = ja.find((v) => v.localService) || ja[0] || null;
    document.getElementById("voice").textContent = jaVoice ? `使う声：${jaVoice.name}` : "日本語の声が見つかりません（端末の設定で日本語の音声を入れてください）";
  }
  // アプリ（app/sound.js の speakNow）と同じ読み方
  function speak(text) {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "ja-JP"; u.rate = 0.9; u.pitch = 1.1;
    if (jaVoice) u.voice = jaVoice;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }
  const box = document.getElementById("lines");
  for (const [no, where, text] of LINES) {
    const s = document.createElement("section");
    s.className = "card";
    s.innerHTML = `<b></b><p></p><button type="button">読む</button>`;
    s.querySelector("b").textContent = `${no}　${where}`;
    s.querySelector("p").textContent = text;
    s.querySelector("button").addEventListener("click", () => speak(text));
    box.append(s);
  }
  document.getElementById("free-btn").addEventListener("click", () => speak(document.getElementById("free").value));
  if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.addEventListener?.("voiceschanged", pickVoice); }
  else document.getElementById("voice").textContent = "このブラウザは読み上げに対応していません";
</script>
</body>
</html>
