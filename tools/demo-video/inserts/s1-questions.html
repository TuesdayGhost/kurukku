<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="_common.css">
<style>
  html,body { background:#2f5d50; }
  .q { position:absolute; background:#fbfaf6; color:#14181c; font-family:"IPAMincho","IPAPMincho",serif; font-size:66px; padding:26px 48px; border-radius:40px 40px 40px 8px; box-shadow:0 12px 30px rgb(0 0 0 / .35); opacity:0; transform:scale(.6); transform-origin:0 100%; white-space:nowrap; }
  .q.r { border-radius:40px 40px 8px 40px; transform-origin:100% 100%; }
  .brand { position:absolute; inset:0; display:grid; place-items:center; opacity:0; }
  .brand .in { display:grid; justify-items:center; gap:22px; }
  .logo { color:#fff; height:190px; width:auto; }
  .tag { color:#fff; font-size:46px; letter-spacing:.12em; }
  .pills { display:flex; gap:22px; margin-top:10px; }
  .pill { background:#fff; color:#2f5d50; font-size:38px; font-weight:700; padding:10px 34px; border-radius:999px; opacity:0; transform:translateY(14px); }
</style></head><body>
<div class="q" id="q1" style="left:220px; top:300px">今日は何日？</div>
<div class="q r" id="q2" style="right:260px; top:200px">お母さんは？</div>
<div class="q" id="q3" style="left:420px; top:560px">新聞はどこ？</div>
<div class="q r" id="q4" style="right:360px; top:620px">今日は何曜日？</div>
<div class="q" id="q5" style="left:780px; top:360px">今日は何日？</div>
<div class="brand" id="brand"><div class="in"><div id="logo"></div><div class="tag">家族の知らせと日々を届ける鳩</div><div class="pills"><span class="pill" id="p1">日付</span><span class="pill" id="p2">予定</span><span class="pill" id="p3">家族の知らせ</span></div></div></div>
<script type="module">
  import { LOGO } from "/app/brand.js";
  document.getElementById("logo").innerHTML = LOGO.replace('class="logo"', 'class="logo"');
  window.DURATION = 11.5;
  const clamp = (x) => Math.max(0, Math.min(1, x)); const back = (x) => { const c = 1.7; x = clamp(x); return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const Q = [["q1", 0.6], ["q2", 2.0], ["q3", 3.1], ["q4", 4.1], ["q5", 5.0]];
  window.render = (t) => {
    const fade = 1 - ease((t - 6.6) / 0.6);
    for (const [id, t0] of Q) { const u = back((t - t0) / 0.5); const e = document.getElementById(id); e.style.opacity = String(Math.min(ease((t - t0) / 0.25), 1) * fade); e.style.transform = `scale(${0.6 + 0.4 * u})`; }
    const b = document.getElementById("brand"); b.style.opacity = String(ease((t - 7.0) / 0.7));
    [["p1", 8.2], ["p2", 8.7], ["p3", 9.2]].forEach(([id, t0]) => { const u = ease((t - t0) / 0.4); const e = document.getElementById(id); e.style.opacity = String(u); e.style.transform = `translateY(${(1 - u) * 14}px)`; });
  };
  window.render(0); window.ready = true;
</script></body></html>
