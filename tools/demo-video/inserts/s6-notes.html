<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="_common.css">
<style>
  .t { position:absolute; left:80px; top:60px; font-size:44px; color:var(--accent); font-weight:700; letter-spacing:.1em; opacity:0; }
  .note { position:absolute; width:560px; background:var(--notice); border-top:14px solid #c99a2e; padding:30px 36px; box-shadow:0 14px 34px rgb(0 0 0 / .16); opacity:0; }
  .note small { display:block; font-size:26px; color:var(--muted); margin-bottom:8px; }
  .note p { margin:0; font-family:"IPAMincho","IPAPMincho",serif; font-size:46px; line-height:1.45; color:var(--fg); }
</style></head><body>
<div class="t" id="t">10月の、家族のひとこと（実際の記録）</div>
<div class="note" id="n1" style="left:120px; top:170px; transform:rotate(-2deg)"><small>10月11日</small><p>デイで芋煮会。</p></div>
<div class="note" id="n2" style="left:700px; top:300px; transform:rotate(1.5deg)"><small>10月20日</small><p>お父さん、お菓子がないとご立腹。</p></div>
<div class="note" id="n3" style="left:1280px; top:150px; transform:rotate(-1deg)"><small>10月28日</small><p>デイで書道を得意そうに披露した。</p></div>
<div class="note" id="n4" style="left:200px; top:560px; transform:rotate(1deg)"><small>10月12日</small><p>夕飯の秋刀魚がとてもおいしかったと言っていた。</p></div>
<div class="note" id="n5" style="left:1180px; top:600px; transform:rotate(-1.5deg)"><small>10月1日</small><p>今日から10月だと、張り切って朝からカレンダーを全部めくっていた。</p></div>
<script>
  window.DURATION = 7.0;
  const clamp = (x) => Math.max(0, Math.min(1, x)); const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
  window.render = (t) => {
    document.getElementById("t").style.opacity = String(ease((t - 0.3) / 0.5));
    [["n1", 0.8], ["n2", 1.7], ["n3", 2.6], ["n4", 3.5], ["n5", 4.4]].forEach(([id, t0]) => { const u = ease((t - t0) / 0.5); const e = document.getElementById(id); e.style.opacity = String(u); e.style.marginTop = `${(1 - u) * -30}px`; });
  };
  window.render(0); window.ready = true;
</script></body></html>
