<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="_common.css">
<style>
  .wrap { position:absolute; inset:0; display:grid; place-items:center; }
  .box { display:grid; justify-items:center; gap:18px; }
  .stamp { width:150px; height:150px; border-radius:50%; background:var(--accent); display:grid; place-items:center; color:var(--bg); --pigeon-bg:var(--accent); }
  .stamp svg { width:100px; height:auto; }
  .small { font-size:38px; color:var(--accent); letter-spacing:.3em; font-weight:700; }
  .big { font-size:84px; font-weight:700; letter-spacing:.08em; }
  .rule { width:420px; height:3px; background:var(--line); margin-top:6px; }
</style></head><body>
<div class="wrap"><div class="box" id="box"><div class="stamp"><svg viewBox="36 60 186 146" aria-hidden="true"><path d="M44 150L82.9 107.97A56 56 0 0 1 131.5 90.5A16 16 0 0 0 148.99 79.19A24 24 0 0 1 195.48 81.01L213.08 94.73L191.42 100.11A24 24 0 0 1 183.7 106.96A16 16 0 0 0 176.5 126.5A56 56 0 0 1 98.39 195.8L56 174Z" fill="currentColor" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="178" cy="81" r="6.5" style="fill: var(--pigeon-bg, #fff)"/>
  <path d="M90 142A34 34 0 0 1 130 112.5" fill="none" style="stroke: var(--pigeon-bg, #fff)" stroke-width="9" stroke-linecap="round"/></svg></div><div class="small">記録</div><div class="big">鳩月報</div><div class="rule"></div></div></div>
<script>
  window.DURATION = 1.4;
  const ease = (x) => 1 - Math.pow(1 - Math.max(0, Math.min(1, x)), 3);
  window.render = (t) => { const u = ease(t / 0.45); const b = document.getElementById("box"); b.style.opacity = String(u); b.style.transform = `translateY(${(1 - u) * 24}px)`; };
  window.render(0); window.ready = true;
</script></body></html>
