<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="_common.css">
<style>
  .env { position:absolute; width:120px; height:84px; background:#fff; border:4px solid var(--accent2); border-radius:10px; box-shadow:0 6px 16px rgb(0 0 0 / .2); opacity:0; }
  .env:before { content:""; position:absolute; left:0; right:0; top:0; border-top:40px solid var(--accent2); border-left:56px solid transparent; border-right:56px solid transparent; opacity:.85; }
  .pigeon { position:absolute; width:220px; height:175px; color:var(--accent); --pigeon-bg:var(--bg); opacity:0; }
  .room { position:absolute; right:140px; top:160px; width:620px; height:720px; background:#fff; border:6px solid var(--accent); border-radius:18px; box-shadow:0 16px 40px rgb(0 0 0 / .16); overflow:hidden; }
  .sign { position:absolute; left:0; right:0; top:0; background:var(--accent); color:#fff; font-size:40px; font-weight:700; text-align:center; padding:14px 0; letter-spacing:.12em; }
  .desk { position:absolute; left:40px; right:40px; top:120px; bottom:40px; }
  .line { height:22px; background:#dfe4e8; border-radius:6px; margin:16px 0; width:0; }
  .line.red { background:var(--red); height:44px; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:26px; margin-top:24px; }
  .cap { position:absolute; left:120px; bottom:70px; font-size:40px; color:var(--muted); opacity:0; }
  .cap b { color:var(--accent); }
</style></head><body>
<div class="env" id="e1" style="left:300px; top:380px"></div><div class="env" id="e2" style="left:460px; top:330px"></div><div class="env" id="e3" style="left:620px; top:400px"></div>
<div class="pigeon" id="pg"><svg viewBox="36 60 186 146" style="width:100%;height:100%"><path d="M44 150L82.9 107.97A56 56 0 0 1 131.5 90.5A16 16 0 0 0 148.99 79.19A24 24 0 0 1 195.48 81.01L213.08 94.73L191.42 100.11A24 24 0 0 1 183.7 106.96A16 16 0 0 0 176.5 126.5A56 56 0 0 1 98.39 195.8L56 174Z" fill="currentColor" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="178" cy="81" r="6.5" style="fill: var(--pigeon-bg, #fff)"/>
  <path d="M90 142A34 34 0 0 1 130 112.5" fill="none" style="stroke: var(--pigeon-bg, #fff)" stroke-width="9" stroke-linecap="round"/></svg></div>
<div class="room" id="room"><div class="sign">Claude 編集室</div><div class="desk" id="desk"><div class="line red" id="h"></div><div class="line" id="s" style="height:30px"></div><div class="cols"><div><div class="line" id="c1"></div><div class="line" id="c2"></div><div class="line" id="c3"></div><div class="line" id="c4"></div></div><div><div class="line" id="c5"></div><div class="line" id="c6"></div><div class="line" id="c7"></div><div class="line" id="c8"></div></div></div></div></div>
<div class="cap" id="cap">メモと集計から、<b>見出しと記事</b>に</div>
<script>
  window.DURATION = 8.5;
  const clamp = (x) => Math.max(0, Math.min(1, x)); const ease = (x) => 1 - Math.pow(1 - clamp(x), 3); const $ = (id) => document.getElementById(id);
  const room = { x: 1920 - 140 - 620, y: 160 };
  window.render = (t) => {
    // 0〜1.2：封筒が現れる。1.2〜4.2：鳩が封筒を集めて編集室へ運ぶ（放物線）。4.0〜：文字が組まれる
    ["e1", "e2", "e3"].forEach((id, i) => { const e = $(id); const u = ease((t - 0.2 - i * 0.3) / 0.4); const carry = ease((t - 1.6) / 2.4);
      const x0 = [300, 460, 620][i], y0 = [380, 330, 400][i]; const x1 = room.x + 300, y1 = room.y + 80; const cx = (x0 + x1) / 2, cy = Math.min(y0, y1) - 300;
      const s = carry; const x = (1 - s) ** 2 * x0 + 2 * (1 - s) * s * cx + s * s * x1, y = (1 - s) ** 2 * y0 + 2 * (1 - s) * s * cy + s * s * y1;
      e.style.left = x + "px"; e.style.top = y + "px"; e.style.opacity = String(u * (1 - ease((t - 3.9) / 0.3))); e.style.transform = `scale(${1 - 0.4 * s})`; });
    const p = $("pg"); const s = ease((t - 1.6) / 2.4); const x0 = 420, y0 = 300, x1 = room.x + 240, y1 = room.y + 30, cx = (x0 + x1) / 2, cy = -40;
    const x = (1 - s) ** 2 * x0 + 2 * (1 - s) * s * cx + s * s * x1, y = (1 - s) ** 2 * y0 + 2 * (1 - s) * s * cy + s * s * y1;
    p.style.left = x + "px"; p.style.top = y + "px"; p.style.opacity = String(ease((t - 1.2) / 0.4) * (1 - ease((t - 4.0) / 0.4))); p.style.transform = `rotate(${Math.sin(t * 22) * 6}deg)`;
    $("h").style.width = `${ease((t - 4.2) / 1.0) * 100}%`; $("s").style.width = `${ease((t - 5.0) / 0.6) * 70}%`;
    for (let i = 1; i <= 8; i++) $("c" + i).style.width = `${ease((t - 5.3 - i * 0.22) / 0.5) * (80 + (i * 37) % 20)}%`;
    $("cap").style.opacity = String(ease((t - 5.6) / 0.6));
  };
  window.render(0); window.ready = true;
</script></body></html>
