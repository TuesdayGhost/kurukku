<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="_common.css">
<style>
  html,body { background:#2f5d50; }
  .wrap { position:absolute; inset:0; display:grid; grid-template-columns:1fr 720px; align-items:center; padding:0 90px 0 110px; box-sizing:border-box; }
  .left { display:grid; gap:34px; color:#fff; }
  .logo { height:170px; width:auto; color:#fff; }
  h1 { margin:0; font-size:96px; line-height:1.25; font-weight:700; letter-spacing:.02em; }
  .sub { font-size:36px; opacity:.92; letter-spacing:.06em; }
  .pills { display:flex; gap:18px; } .pill { background:#fff; color:#2f5d50; font-size:34px; font-weight:700; padding:8px 30px; border-radius:999px; }
  .shot { width:720px; height:500px; border-radius:22px; overflow:hidden; box-shadow:0 24px 60px rgb(0 0 0 / .4); transform:rotate(-3deg); background:#fff; }
  .shot img { width:100%; height:100%; object-fit:cover; object-position:0% 35%; }
  .tag { position:absolute; right:90px; bottom:60px; background:#fff; color:#2f5d50; font-size:30px; font-weight:700; padding:8px 26px; border-radius:999px; }
</style></head><body>
<div class="wrap"><div class="left"><div id="logo"></div><h1>家族の知らせと<br>日々を届ける鳩</h1><div class="sub">介護するすべての人に、ほんの少し、息をつく時間を。</div><div class="pills"><span class="pill">日付・予定</span><span class="pill">家族の知らせ</span><span class="pill">鳩月報</span></div></div>
<div class="shot"><img src="/tools/demo-video/out/ui/display-bank.png"></div></div>
<div class="tag">Built with Claude · Japan 2026</div>
<script type="module">
  import { LOGO } from "/app/brand.js"; document.getElementById("logo").innerHTML = LOGO;
  const im = document.querySelector("img"); if (im.complete) window.ready = true; else im.onload = () => { window.ready = true; };
</script></body></html>
