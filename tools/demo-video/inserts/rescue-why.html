<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="_common.css">
<style>
  .wrap { position:absolute; inset:0 0 180px 0; display:grid; place-items:center; }
  .col { display:grid; gap:44px; width:1500px; }
  .row { display:flex; align-items:baseline; gap:34px; font-size:72px; font-weight:700; opacity:0; transform:translateY(16px); }
  .row .k { color:var(--muted); font-size:44px; font-weight:500; width:420px; text-align:right; }
  .row .v { color:var(--fg); }
  .q { display:inline-block; color:var(--red); font-size:100px; line-height:1; transform-origin:50% 70%; }
  .photo { width:120px; height:150px; border:3px dashed var(--line); border-radius:8px; display:inline-grid; place-items:center; font-size:22px; color:var(--muted); vertical-align:middle; margin-right:16px; background:#fff; }
</style></head><body>
<div class="wrap"><div class="col">
  <div class="row" id="r1"><span class="k">手元の写真は</span><span class="v"><span class="photo">デイの<br>プリント</span>1枚だけ</span></div>
  <div class="row" id="r2"><span class="k">身長</span><span class="v"><span class="q" id="q1">?</span> cm</span></div>
  <div class="row" id="r3"><span class="k">靴のサイズ</span><span class="v"><span class="q" id="q2">?</span> cm</span></div>
</div></div>
<script>
  window.DURATION = 16.6;
  const clamp = (x) => Math.max(0, Math.min(1, x)); const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
  const show = (id, t0, t) => { const u = ease((t - t0) / 0.5); const e = document.getElementById(id); e.style.opacity = String(u); e.style.transform = `translateY(${(1 - u) * 16}px)`; };
  window.render = (t) => {
    show("r1", 1.0, t); show("r2", 9.5, t); show("r3", 11.8, t);
    // 「身長も分かりませんでした」(14.4〜) で ? をそっと強調
    const p = t > 14.4 ? 1 + 0.18 * Math.sin(Math.min(Math.PI, (t - 14.4) * 2.2)) : 1;
    for (const id of ["q1", "q2"]) { const e = document.getElementById(id); e.style.transform = `scale(${p})`; e.style.color = t > 14.4 ? "#c8102e" : "#a3362b"; }
  };
  window.render(0); window.ready = true;
</script></body></html>
