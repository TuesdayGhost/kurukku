<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="_common.css">
<style>
  .t { position:absolute; left:80px; top:50px; font-size:44px; color:var(--accent); font-weight:700; letter-spacing:.1em; }
  .pair { position:absolute; left:0; right:0; top:170px; display:grid; grid-template-columns:620px 80px 1000px; justify-content:center; align-items:center; gap:0; opacity:0; }
  .note { background:var(--notice); border-top:14px solid #c99a2e; padding:30px 36px; box-shadow:0 14px 34px rgb(0 0 0 / .16); transform:rotate(-1.5deg); }
  .note small { display:block; font-size:26px; color:var(--muted); margin-bottom:8px; } .note p { margin:0; font-family:"IPAMincho",serif; font-size:46px; line-height:1.45; }
  .arrow { font-size:70px; color:var(--accent); text-align:center; }
  .art { background:#fbfaf6; border:4px solid #141414; padding:30px 40px; box-shadow:0 14px 34px rgb(0 0 0 / .16); }
  .art h3 { margin:0 0 10px; font-size:40px; border-left:10px solid var(--red); padding-left:14px; }
  .art p { margin:0; font-size:38px; line-height:1.6; }
  mark { background:linear-gradient(transparent 38%, #ffe66d 38%); color:inherit; background-repeat:no-repeat; background-size:0% 100%; }
  mark.on { background-size:100% 100%; transition:background-size .7s ease-out; }
  .foot { position:absolute; left:80px; bottom:50px; font-size:30px; color:var(--muted); }
</style></head><body>
<div class="t">こんな出来事が、こんな記事に</div>
<div class="pair" id="p1"><div class="note"><small>10月11日のひとこと</small><p><mark id="m1">デイで芋煮会</mark>。</p></div><div class="arrow">→</div><div class="art"><h3>お父さん書道で魅せた</h3><p>28日、お父さんがデイで書道を得意そうに披露！<mark id="a1">11日はデイで芋煮会</mark>、12日は夕飯の秋刀魚を「とてもおいしかった」と大絶賛。秋の味覚と芸術を満喫した10月だ。</p></div></div>
<div class="pair" id="p2"><div class="note"><small>10月20日のひとこと</small><p>お父さん、<mark id="m2">お菓子がないとご立腹</mark>。</p></div><div class="arrow">→</div><div class="art"><h3>お菓子問題が勃発</h3><p>20日、<mark id="a2">お父さんが「お菓子がない」とご立腹</mark>。台所の補給線に穴があいた格好だ。お母さんの買い物は今月予定4回、次の補給に注目が集まる。</p></div></div>
<div class="foot">記事は 2026年10月号から、実際に生成された文章のまま</div>
<script>
  window.DURATION = 11.0;
  const clamp = (x) => Math.max(0, Math.min(1, x)); const ease = (x) => 1 - Math.pow(1 - clamp(x), 3); const $ = (id) => document.getElementById(id);
  window.render = (t) => {
    const a1 = ease((t - 0.3) / 0.5) * (1 - ease((t - 5.0) / 0.4)); $("p1").style.opacity = String(a1);
    const a2 = ease((t - 5.4) / 0.5); $("p2").style.opacity = String(a2);
    $("m1").classList.toggle("on", t >= 1.3); $("a1").classList.toggle("on", t >= 1.3);
    $("m2").classList.toggle("on", t >= 6.4); $("a2").classList.toggle("on", t >= 6.4);
  };
  window.render(0); window.ready = true;
</script></body></html>
